apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  labels:
    app.kubernetes.io/name: alfresco
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: alfresco
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: alfresco
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: alfresco
spec:
  selector:
    app.kubernetes.io/name: alfresco
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: alfresco
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: alfresco
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alfresco
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alfresco
        app.kubernetes.io/component: postgres
        app.kubernetes.io/part-of: alfresco
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # L'image officielle Postgres doit démarrer en root : son entrypoint
      # passe le répertoire de données en 0700, puis bascule sur l'utilisateur
      # postgres. Les volumes local-path de Docker Desktop sont root:root en
      # 0777, et un initdb non-root échoue avec « Operation not permitted ».
      securityContext:
        fsGroup: 999
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: postgres
          image: postgres:17.9
          imagePullPolicy: IfNotPresent
          args:
            - postgres
            - -c
            - max_connections=300
            - -c
            - log_min_messages=LOG
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: alfresco-secret
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alfresco-secret
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: alfresco-config
                  key: DB_NAME
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -d "$POSTGRES_DB" -U "$POSTGRES_USER"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -d "$POSTGRES_DB" -U "$POSTGRES_USER"
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
