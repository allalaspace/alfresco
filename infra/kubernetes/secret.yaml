# Mots de passe de développement, identiques à infra/alfresco/.env.example.
# À remplacer avant tout usage autre que local.
apiVersion: v1
kind: Secret
metadata:
  name: alfresco-secret
  labels:
    app.kubernetes.io/name: alfresco
    app.kubernetes.io/part-of: alfresco
type: Opaque
stringData:
  DB_USER: alfresco
  DB_PASSWORD: alfresco
  ACTIVEMQ_USER: admin
  ACTIVEMQ_PASSWORD: admin
  TRANSFORM_SHARED_SECRET: secret
  ALFRESCO_ADMIN_USER: admin
  ALFRESCO_ADMIN_PASSWORD: admin
