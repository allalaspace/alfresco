apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alfresco-data
  labels:
    app.kubernetes.io/name: alfresco
    app.kubernetes.io/component: repository
    app.kubernetes.io/part-of: alfresco
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: alfresco
  labels:
    app.kubernetes.io/name: alfresco
    app.kubernetes.io/component: repository
    app.kubernetes.io/part-of: alfresco
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: alfresco
    app.kubernetes.io/component: repository
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alfresco
  labels:
    app.kubernetes.io/name: alfresco
    app.kubernetes.io/component: repository
    app.kubernetes.io/part-of: alfresco
spec:
  replicas: 1
  # Le premier démarrage charge le schéma et reste non prêt au-delà des 600 s
  # par défaut, ce qui marque le Deployment en échec alors qu'il démarre encore.
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alfresco
      app.kubernetes.io/component: repository
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alfresco
        app.kubernetes.io/component: repository
        app.kubernetes.io/part-of: alfresco
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      initContainers:
        - name: fix-contentstore-permissions
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - chmod -R a+rwx /usr/local/tomcat/alf_data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /usr/local/tomcat/alf_data
        - name: wait-dependencies
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "attente de postgres"
                sleep 2
              done
              until nc -z activemq 61616; do
                echo "attente d'activemq"
                sleep 2
              done
              until wget -q -O- http://elasticsearch:9200/_cluster/health | grep -E -q 'green|yellow'; do
                echo "attente d'elasticsearch"
                sleep 3
              done
      containers:
        - name: alfresco
          image: docker.io/alfresco/alfresco-content-repository-community:26.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: alfresco-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alfresco-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: alfresco-config
                  key: DB_NAME
            - name: TRANSFORM_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: alfresco-secret
                  key: TRANSFORM_SHARED_SECRET
            - name: ACTIVEMQ_USER
              valueFrom:
                secretKeyRef:
                  name: alfresco-secret
                  key: ACTIVEMQ_USER
            - name: ACTIVEMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alfresco-secret
                  key: ACTIVEMQ_PASSWORD
            - name: ALFRESCO_PUBLIC_HOST
              valueFrom:
                configMapKeyRef:
                  name: alfresco-config
                  key: ALFRESCO_PUBLIC_HOST
            - name: ALFRESCO_PORT
              valueFrom:
                configMapKeyRef:
                  name: alfresco-config
                  key: ALFRESCO_PORT
            - name: SHARE_PORT
              valueFrom:
                configMapKeyRef:
                  name: alfresco-config
                  key: SHARE_PORT
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Dencryption.keystore.type=JCEKS
                -Dencryption.cipherAlgorithm=DESede/CBC/PKCS5Padding
                -Dencryption.keyAlgorithm=DESede
                -Dencryption.keystore.location=/usr/local/tomcat/shared/classes/alfresco/extension/keystore/keystore
                -Dmetadata-keystore.password=mp6yc0UD9e
                -Dmetadata-keystore.aliases=metadata
                -Dmetadata-keystore.metadata.password=oKIWzVdEdA
                -Dmetadata-keystore.metadata.algorithm=DESede
            # deployment.method doit être une valeur de l'enum ACS 26.2
            # (DEFAULT, INSTALLER, DOCKER_COMPOSE, HELM_CHART, ANSIBLE, QUICK_START).
            - name: JAVA_OPTS
              value: >-
                -Ddb.driver=org.postgresql.Driver
                -Ddb.username=$(DB_USER)
                -Ddb.password=$(DB_PASSWORD)
                -Ddb.url=jdbc:postgresql://postgres:5432/$(DB_NAME)
                -Dsolr.secureComms=secret
                -Dsolr.sharedSecret=$(TRANSFORM_SHARED_SECRET)
                -Dindex.subsystem.name=elasticsearch
                -Delasticsearch.createIndexIfNotExists=true
                -Delasticsearch.host=elasticsearch
                -Delasticsearch.port=9200
                -Dshare.host=$(ALFRESCO_PUBLIC_HOST)
                -Dshare.port=$(SHARE_PORT)
                -Dalfresco.host=$(ALFRESCO_PUBLIC_HOST)
                -Dalfresco.port=$(ALFRESCO_PORT)
                -Dcsrf.filter.enabled=false
                -Daos.baseUrlOverwrite=http://$(ALFRESCO_PUBLIC_HOST):$(ALFRESCO_PORT)/alfresco/aos
                -Dmessaging.broker.url="failover:(nio://activemq:61616)?timeout=3000&jms.useCompression=true"
                -Dmessaging.broker.username=$(ACTIVEMQ_USER)
                -Dmessaging.broker.password=$(ACTIVEMQ_PASSWORD)
                -Ddeployment.method=DEFAULT
                -DlocalTransform.core-aio.url=http://transform-core-aio:8090/
                -XX:MinRAMPercentage=50
                -XX:MaxRAMPercentage=80
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 1900Mi
          startupProbe:
            httpGet:
              path: /alfresco/api/-default-/public/alfresco/versions/1/probes/-ready-
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /alfresco/api/-default-/public/alfresco/versions/1/probes/-ready-
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /usr/local/tomcat/alf_data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: alfresco-data
