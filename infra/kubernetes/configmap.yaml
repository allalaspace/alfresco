# Réglages non secrets. Les ports publics sont les NodePorts
# (localhost:30080, :30081, :30161 sur Docker Desktop).
# Les services internes continuent d'écouter sur 8080 / 8161 / 61616.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alfresco-config
  labels:
    app.kubernetes.io/name: alfresco
    app.kubernetes.io/part-of: alfresco
data:
  ALFRESCO_PUBLIC_HOST: localhost
  ALFRESCO_PORT: "30080"
  SHARE_PORT: "30081"
  ACTIVEMQ_CONSOLE_PORT: "30161"
  DB_NAME: alfresco
