apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data
  labels:
    app.kubernetes.io/name: alfresco
    app.kubernetes.io/component: elasticsearch
    app.kubernetes.io/part-of: alfresco
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  labels:
    app.kubernetes.io/name: alfresco
    app.kubernetes.io/component: elasticsearch
    app.kubernetes.io/part-of: alfresco
spec:
  selector:
    app.kubernetes.io/name: alfresco
    app.kubernetes.io/component: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  labels:
    app.kubernetes.io/name: alfresco
    app.kubernetes.io/component: elasticsearch
    app.kubernetes.io/part-of: alfresco
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alfresco
      app.kubernetes.io/component: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alfresco
        app.kubernetes.io/component: elasticsearch
        app.kubernetes.io/part-of: alfresco
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.17.10
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: -Xms512m -Xmx512m
            # Évite le sysctl hôte vm.max_map_count, souvent impossible dans un cluster local.
            - name: node.store.allow_mmap
              value: "false"
            - name: ingest.geoip.downloader.enabled
              value: "false"
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            # Le tas fait 512m. Elasticsearch consomme aussi hors tas, et une
            # limite cgroup de 1Gi tue le processus (exit 137) sur Docker Desktop.
            limits:
              memory: 2Gi
          startupProbe:
            exec:
              command:
                - bash
                - -c
                - curl -s http://localhost:9200/_cluster/health | grep -qE '"status":"(green|yellow)"'
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 20
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - curl -s http://localhost:9200/_cluster/health | grep -qE '"status":"(green|yellow)"'
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: elasticsearch-data
