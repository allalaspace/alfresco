apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-indexing
  labels:
    app.kubernetes.io/name: alfresco
    app.kubernetes.io/component: batch-indexing
    app.kubernetes.io/part-of: alfresco
spec:
  replicas: 1
  # L'indexation reste en init tant qu'Alfresco n'est pas prêt, au-delà des 600 s par défaut.
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app.kubernetes.io/name: alfresco
      app.kubernetes.io/component: batch-indexing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alfresco
        app.kubernetes.io/component: batch-indexing
        app.kubernetes.io/part-of: alfresco
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      initContainers:
        - name: wait-dependencies
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until wget -q -O- http://elasticsearch:9200/_cluster/health | grep -E -q 'green|yellow'; do
                echo "attente d'elasticsearch"
                sleep 3
              done
              until wget -q -O- http://alfresco:8080/alfresco/api/-default-/public/alfresco/versions/1/probes/-ready-; do
                echo "attente d'alfresco"
                sleep 5
              done
              until wget -q -O- http://transform-core-aio:8090/ready; do
                echo "attente du transform core"
                sleep 3
              done
      containers:
        - name: batch-indexing
          image: docker.io/alfresco/alfresco-elasticsearch-batch-indexing:5.8.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: alfresco-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alfresco-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: alfresco-config
                  key: DB_NAME
            - name: TRANSFORM_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: alfresco-secret
                  key: TRANSFORM_SHARED_SECRET
            - name: JAVA_OPTS
              value: -Xms256m -Xmx768m
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/$(DB_NAME)
            - name: SPRING_DATASOURCE_USERNAME
              value: $(DB_USER)
            - name: SPRING_DATASOURCE_PASSWORD
              value: $(DB_PASSWORD)
            - name: SPRING_ELASTICSEARCH_REST_URIS
              value: http://elasticsearch:9200
            - name: ALFRESCO_ACCEPTEDCONTENTMEDIATYPESCACHE_BASEURL
              value: http://transform-core-aio:8090/transform/config
            - name: ALFRESCO_ACS_URL
              value: http://alfresco:8080
            - name: ALFRESCO_CONTENT_TRANSFORM_SHAREDSECRET
              value: $(TRANSFORM_SHARED_SECRET)
            - name: ALFRESCO_REINDEX_CONTINUOUS_POLLINGINTERVAL
              value: 15s
            - name: ALFRESCO_REINDEX_CONTINUOUS_CATCHUPPOLLINGINTERVAL
              value: 1s
            - name: ALFRESCO_REINDEX_CONTINUOUS_MAXWINDOW
              value: 30m
            - name: ALFRESCO_REINDEX_CONTINUOUS_OVERLAP
              value: 10m
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
